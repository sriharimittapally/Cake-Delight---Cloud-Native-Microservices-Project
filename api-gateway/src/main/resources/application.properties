
spring.application.name=api-gateway

server.port=8080

# Cake Catalog Service
spring.cloud.gateway.server.webmvc.routes[0].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${CATALOG_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/cakes/**

# Order Service
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${ORDER_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**

# Rating Service
spring.cloud.gateway.server.webmvc.routes[2].id=rating-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${RATING_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/ratings/**

spring.cloud.gateway.server.webmvc.routes[3].id=basket-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${ORDER_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/baskets/**

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read-only

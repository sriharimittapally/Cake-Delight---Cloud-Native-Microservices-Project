
# ==================== APPLICATION ====================

# Defines the name of this microservice.
spring.application.name=cake-catalog-service


# ==================== SERVER ====================

# Sets the port on which the service runs.
server.port=8081


# ==================== DATABASE ====================

# Specifies the MySQL database URL, port and database name.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${CAKE_CATALOG_DB}

# Specifies the MySQL database username.
spring.datasource.username=${MYSQL_USERNAME}

# Specifies the MySQL database password.
spring.datasource.password=${MYSQL_PASSWORD}

# Specifies the MySQL JDBC driver.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==================== JPA / HIBERNATE ====================

# Validates the database schema against the JPA entity mappings.
# Does not create or modify database tables.
spring.jpa.hibernate.ddl-auto=validate

# Displays SQL queries generated by Hibernate in the console.
spring.jpa.show-sql=true

# Formats SQL queries for better readability.
spring.jpa.properties.hibernate.format_sql=true

# Prevents database sessions from remaining open during web response processing.
spring.jpa.open-in-view=false


# ==================== SQL INITIALIZATION ====================

# Executes schema.sql and data.sql during application startup.
spring.sql.init.mode=always

# Stops application startup if SQL initialization encounters an error.
spring.sql.init.continue-on-error=false


# ==================== LOGGING ====================

# Displays application-level DEBUG, INFO, WARN and ERROR logs.
logging.level.com.cakedelight.catalog=INFO


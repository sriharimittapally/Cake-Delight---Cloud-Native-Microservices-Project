# ==================== APPLICATION ====================
spring.application.name=order-service

# ==================== SERVER ====================
server.port=8082

# ==================== DATABASE ====================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${CAKE_ORDER_DB}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==================== CATALOG SERVICE ====================
catalog.service.url=${CATALOG_SERVICE_URL}

# ==================== RABBITMQ ====================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# ==================== LOGGING ====================
logging.level.com.cakedelight.order=INFO

logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.amqp.rabbit=DEBUG

logging.level.org.springframework.boot.autoconfigure.amqp=DEBUG

# 1. Cake Catalog Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: cake-delight-catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: cake-delight-config
          env:
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cake-delight-secrets
                  key: MYSQL_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cake-delight-secrets
                  key: MYSQL_PASSWORD

---
# 2. Cake Catalog Service
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: cake-delight
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
